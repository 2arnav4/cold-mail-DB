finding:
  type: bug
  title: WAL slot leak on connector restart when the publication is dropped mid stream
  summary: >
    On restart, cdc-core recreates the replication slot before checking whether
    the publication still exists. If the publication was dropped while the
    connector was down, the old slot is never released and Postgres keeps
    retaining WAL. On a test instance this held 4.2 GB of WAL across six
    restarts. A three line reordering in slot.go fixes it, and I have a repro
    plus a proposed patch ready to open as a PR.
  evidence: |
    $ docker compose up -d postgres
    $ ./cdc-core --slot=nw_test --publication=nw_pub
    $ psql -c 'DROP PUBLICATION nw_pub;'
    $ pkill cdc-core && ./cdc-core --slot=nw_test --publication=nw_pub

    $ psql -c "SELECT slot_name, active,
        pg_size_pretty(pg_wal_lsn_diff(
          pg_current_wal_lsn(), restart_lsn)) AS retained
        FROM pg_replication_slots;"

      slot_name  | active | retained
    -------------+--------+----------
     nw_test     | f      | 712 MB
     nw_test_1   | t      | 0 bytes

    Repeated six times: 4.2 GB retained, zero slots reclaimed.

    slot.go:118  createSlot() runs before validatePublication()
    Swapping the two, and dropping the orphan in the error path,
    releases the slot on every restart in the same test.
  link: https://github.com/2arnav4/northwind-wal-repro

