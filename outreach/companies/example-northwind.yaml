  - project: shiplog
    what: An Express and Postgres service that ingests 200k webhook events a day into a partitioned table, with idempotency keys and a replay endpoint.
    why_relevant: Northwind's webhook sink has the same at least once delivery problem, and I have already made the ordering and dedupe tradeoffs once.
  - project: dsa-bench
    what: A C++ harness that benchmarks 60 data structure implementations and tracks regressions across commits.
    why_relevant: Evidence I measure before I claim, which is the habit behind the WAL numbers on the previous slide.

